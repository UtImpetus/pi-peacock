    <rect class="background" height="100%" width="100%" x="0" y="0"/><defs><g id="g1"><text x="0" textLength="800" class="foreground">                                                                                                    </text></g><g id="g2"><text x="0" textLength="8" class="foreground"> </text><text x="8" textLength="32" font-weight="bold" fill="#4fd6be">read</text><text x="40" textLength="8" class="foreground"> </text><text x="48" textLength="400" fill="#4fd6be">/tmp/pi-peacock-shot-mThYfk/demo-rule/src/index.ts</text><text x="448" textLength="352" class="foreground">                                            </text></g><g id="g3"><text x="0" textLength="8" class="foreground"> </text><text x="8" textLength="520" font-style="italic" fill="#90bdb7">Let me also look at the docs directory to get a bit more context.</text><text x="528" textLength="272" class="foreground">                                  </text></g><g id="g4"><text x="0" textLength="800" class="foreground"> Here are 5 short bullets on the project:                                                           </text></g><g id="g5"><text x="0" textLength="8" class="foreground"> </text><text x="8" textLength="16" fill="#4fd6be">- </text><text x="24" textLength="152" font-weight="bold" class="foreground">Top-level structure</text><text x="176" textLength="16" class="foreground">: </text><text x="192" textLength="40" fill="#7be7d8">.git/</text><text x="232" textLength="16" class="foreground">, </text><text x="248" textLength="32" fill="#7be7d8">.pi/</text><text x="280" textLength="16" class="foreground">, </text><text x="296" textLength="40" fill="#7be7d8">docs/</text><text x="336" textLength="16" class="foreground">, </text><text x="352" textLength="32" fill="#7be7d8">src/</text><text x="384" textLength="16" class="foreground">, </text><text x="400" textLength="96" fill="#7be7d8">package.json</text><text x="496" textLength="48" class="foreground">, and </text><text x="544" textLength="72" fill="#7be7d8">README.md</text><text x="616" textLength="184" class="foreground">.                      </text></g><g id="g6"><text x="0" textLength="8" class="foreground"> </text><text x="8" textLength="16" fill="#4fd6be">- </text><text x="24" textLength="112" font-weight="bold" class="foreground">Peacock config</text><text x="136" textLength="16" class="foreground"> (</text><text x="152" textLength="128" fill="#7be7d8">.pi/peacock.json</text><text x="280" textLength="104" class="foreground">): defines a </text><text x="384" textLength="72" fill="#7be7d8">demo-rule</text><text x="456" textLength="344" class="foreground"> repo rule that                            </text></g><g id="g7"><text x="0" textLength="136" class="foreground">   auto-sets the </text><text x="136" textLength="96" font-weight="bold" class="foreground">peacock-cyan</text><text x="232" textLength="80" class="foreground"> theme, a </text><text x="312" textLength="88" font-weight="bold" class="foreground">client-work</text><text x="400" textLength="400" class="foreground"> status/label, and a custom                       </text></g><g id="g8"><text x="0" textLength="144" class="foreground">   terminal title </text><text x="144" textLength="160" fill="#7be7d8">&#960; {label} &#183; {branch}</text><text x="304" textLength="496" class="foreground">.                                                             </text></g><g id="g9"><text x="0" textLength="8" class="foreground"> </text><text x="8" textLength="16" fill="#4fd6be">- </text><text x="24" textLength="48" font-weight="bold" class="foreground">README</text><text x="72" textLength="424" class="foreground">: a minimal description &#8212; the repo exists to preview </text><text x="496" textLength="144" font-weight="bold" class="foreground">pi-peacock's      </text><text x="640" textLength="160" class="foreground">                    </text></g><g id="g10"><text x="0" textLength="24" class="foreground">   </text><text x="24" textLength="152" font-weight="bold" class="foreground">rule-based identity</text><text x="176" textLength="624" class="foreground"> feature.                                                                     </text></g><g id="g11"><text x="0" textLength="8" class="foreground"> </text><text x="8" textLength="16" fill="#4fd6be">- </text><text x="24" textLength="48" font-weight="bold" class="foreground">Source</text><text x="72" textLength="16" class="foreground"> (</text><text x="88" textLength="96" fill="#7be7d8">src/index.ts</text><text x="184" textLength="88" class="foreground">): exports </text><text x="272" textLength="64" fill="#7be7d8">customer</text><text x="336" textLength="24" class="foreground"> = </text><text x="360" textLength="104" fill="#7be7d8">"client-work"</text><text x="464" textLength="40" class="foreground"> and </text><text x="504" textLength="40" fill="#7be7d8">theme</text><text x="544" textLength="256" class="foreground"> =                              </text></g><g id="g12"><text x="0" textLength="24" class="foreground">   </text><text x="24" textLength="112" fill="#7be7d8">"peacock-cyan"</text><text x="136" textLength="664" class="foreground">, then logs them.                                                                  </text></g><g id="g13"><text x="0" textLength="8" class="foreground"> </text><text x="8" textLength="16" fill="#4fd6be">- </text><text x="24" textLength="56" font-weight="bold" class="foreground">Purpose</text><text x="80" textLength="296" class="foreground">: demonstrates how peacock rules can </text><text x="376" textLength="264" font-weight="bold" class="foreground">bind a repo to a specific theme, </text><text x="640" textLength="160" class="foreground">                    </text></g><g id="g14"><text x="0" textLength="24" class="foreground">   </text><text x="24" textLength="192" font-weight="bold" class="foreground">label, status, and title</text><text x="216" textLength="584" class="foreground"> whenever you're working in that directory.        